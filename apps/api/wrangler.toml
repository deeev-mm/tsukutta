name = "tsukutta-api"
main = "src/index.ts"
compatibility_date = "2025-02-24"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "family-cook-log"
database_id = "d3d4d2a9-ed89-4ac4-9830-48ad6adf3d5f"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "family-cook-log-images"

[vars]
CORS_ALLOWED_ORIGINS = "https://tsukutta-web.deeev-work.workers.dev"
APP_BASE_URL = "https://tsukutta-web.deeev-work.workers.dev"
SESSION_COOKIE_NAME = "tsukutta_session"
