<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オフライン - tsukutta</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #f4faf7, #e8f0ee);
        color: #14231f;
        font-family: "Hiragino Sans", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 320px;
      }
      h1 {
        font-size: 1.2rem;
        margin-bottom: 8px;
      }
      p {
        color: #4a5f58;
        margin-bottom: 20px;
      }
      button {
        font: inherit;
        cursor: pointer;
        background: #1f6b5c;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>オフラインです</h1>
      <p>電波の良いところで再読み込みしてください。以前に開いたページはキャッシュから見られる場合があります。</p>
      <button onclick="location.reload()">再読み込み</button>
    </div>
  </body>
</html>
